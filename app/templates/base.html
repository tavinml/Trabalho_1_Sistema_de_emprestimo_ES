<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Empréstimo de Equipamentos — Laboratório</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        nav a { margin-right: 1.2rem; text-decoration: none; color: #0b5fff; font-weight: 600; }
        nav { margin-bottom: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem; }
        h1 { font-size: 1.4rem; }
        table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #eee; }
        th { background: #f6f6f6; }
        form.inline { display: inline; }
        .form-cadastro { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .form-cadastro input { padding: 0.4rem; }
        .form-cadastro button { padding: 0.4rem 0.9rem; }
        .erro { background: #ffe3e3; border: 1px solid #ffa3a3; padding: 0.6rem 1rem; border-radius: 4px; margin-bottom: 1rem; }
        .atrasado { color: #c0392b; font-weight: 600; }
        .btn-devolver { background: #0b5fff; color: white; border: none; padding: 0.35rem 0.8rem; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Início</a>
        <a href="/alunos">Alunos</a>
        <a href="/equipamentos">Equipamentos</a>
        <a href="/emprestimos">Empréstimos</a>
        <a href="/atrasados">Relatório de atrasos</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
